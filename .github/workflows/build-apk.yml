name: Build Android APK

# 触发方式：
#   - 手动：GitHub 仓库 Actions 页面点 "Run workflow"
#   - 自动：push 到 main 分支
on:
  workflow_dispatch:
  push:
    branches: [main]

# 新推送自动取消还在跑的旧构建（节省时间/配额，保证 APK 用最新代码）
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flet
        run: pip install flet

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          flet build apk \
            --project daily_tasks \
            --product "每日任务" \
            --org com.example \
            --bundle-id com.example.daily_tasks \
            --build-version 1.0.0 \
            --build-number 1 \
            --android-permissions android.permission.POST_NOTIFICATIONS=true android.permission.VIBRATE=true \
            --android-adaptive-icon-background "#3F51B5" \
            --arch arm64-v8a \
            --android-signing-key-store "${{ github.workspace }}/android/daily_tasks.keystore" \
            --android-signing-key-store-password "DT-apk-2026-key" \
            --android-signing-key-password "DT-apk-2026-key" \
            --android-signing-key-alias daily_tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-apk
          path: build/apk/*.apk
