name: Build Android APK

# 触发方式：
#   - 手动：GitHub 仓库 Actions 页面点 "Run workflow"
#   - 自动：push 到 main 分支
on:
  workflow_dispatch:
  push:
    branches: [main]

# 新推送自动取消还在跑的旧构建（节省时间/配额，保证 APK 用最新代码）
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flet-cli==0.86.5

      - name: Fetch Flet Python manifest
        run: |
          for i in 1 2 3 4 5; do
            if curl -fL --retry 5 --retry-all-errors \
              -o python_manifest.json \
              "https://github.com/flet-dev/python-build/releases/download/20260730/manifest.json"; then
              break
            fi
            echo "retry $i"
            sleep 5
          done
          test -s python_manifest.json

      - name: Run UI smoke test
        run: python ui_test.py

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        env:
          FLET_PYTHON_BUILD_MANIFEST: ${{ github.workspace }}/python_manifest.json
        run: |
          for i in 1 2 3; do
            echo "Flet build attempt $i"
            if yes | flet build apk \
              --project daily_tasks \
              --product "天野陽菜" \
              --org com.example \
              --bundle-id com.example.daily_tasks \
              --build-version 1.0.0 \
              --build-number 1 \
              --android-permissions android.permission.POST_NOTIFICATIONS=true android.permission.VIBRATE=true \
              --android-adaptive-icon-background "#3F51B5" \
              --arch arm64-v8a \
              --android-signing-key-store "${{ github.workspace }}/android/daily_tasks.keystore" \
              --android-signing-key-store-password "DT-apk-2026-key" \
              --android-signing-key-password "DT-apk-2026-key" \
              --android-signing-key-alias daily_tasks
            then
              echo "Flet build succeeded"
              break
            fi
            echo "Flet build failed, retrying..."
            sleep 20
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-apk
          path: build/apk/*.apk
